x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile.api

x-api-env: &api-env
  # Password comes from .env (default keeps the existing volume working until the password is rotated
  # with ALTER ROLE svitlo inside the DB: changing it here alone does NOT change an existing volume).
  DATABASE_URL: postgresql://svitlo:${POSTGRES_PASSWORD:-energymon}@db:5432/svitlo
  API_PORT: "3001"
  API_HOST: "0.0.0.0"
  SNAPSHOT_DIR: /var/lib/svitlo/snapshots
  ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a long random ADMIN_TOKEN in .env}
  SOURCE_URL: http://manual-import.invalid/disabled
  USE_MOCK_ADAPTER: "false"
  # Автоопрос оператора. По умолчанию ВЫКЛ (локальная разработка не должна стучаться к WAF оператора).
  # В production поставьте ENABLE_SCHEDULER=true в .env, иначе данные не обновляются (см. /status dataStale).
  ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
  # Диапазоны доверенных прокси (nginx в compose-сети) — нужны для корректного rate limit по IP посетителя.
  TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
  TELEGRAM_BOT_ENABLED: "false"
  CHERNIHIV_WEB_ENABLED: ${CHERNIHIV_WEB_ENABLED:-true}
  CHERNIHIV_BASE_URL: ${CHERNIHIV_BASE_URL:-https://chernihivoblenergo.com.ua}
  CHERNIHIV_CITY_IDS: ${CHERNIHIV_CITY_IDS:-7422288601}
  CHERNIHIV_OUTAGE_TYPES: ${CHERNIHIV_OUTAGE_TYPES:-1,2,6}
  # Пауза між запитами до оператора + прогрів сесії (GET /power_outages) — щоб не тригерити WAF.
  CHERNIHIV_REQUEST_DELAY_MS: ${CHERNIHIV_REQUEST_DELAY_MS:-1000}
  CHERNIHIV_SESSION_WARMUP: ${CHERNIHIV_SESSION_WARMUP:-true}
  # Рідше опитування (30 хв) + джиттер, бо розклад ГПВ змінюється нечасто, а WAF не любить регулярність.
  PARSE_INTERVAL_MINUTES: ${PARSE_INTERVAL_MINUTES:-30}
  PARSE_INTERVAL_JITTER_MINUTES: ${PARSE_INTERVAL_JITTER_MINUTES:-5}
  NODE_ENV: production
  LOG_LEVEL: info
  TZ: Europe/Kyiv
  # Оператор віддає неповний TLS-ланцюжок (без проміжного CA) — додаємо його з бандла,
  # щоб Node міг перевірити сертифікат chernihivoblenergo.com.ua без вимкнення перевірки.
  NODE_EXTRA_CA_CERTS: /app/apps/api/operator-ca.pem
  # Контейнерний DNS повертає NAT64-адресу (64:ff9b::/96), яка тут не маршрутизується, і undici
  # «зависає» на ній (ETIMEDOUT). Форсуємо IPv4.
  NODE_OPTIONS: "--dns-result-order=ipv4first"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: svitlo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energymon}
      POSTGRES_DB: svitlo
    ports:
      # Доступ только через loopback: сервисы ходят в БД по compose-сети,
      # публиковать порт наружу не нужно (аудит, P0 3.3).
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svitlo"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Одноразовий сервис: применяет SQL-миграции (node dist/db/migrate.js), затем завершается.
  # api стартует только после его успешного завершения (service_completed_successfully),
  # поэтому на чистом томе база гарантированно мигрирована до старта API.
  migrate:
    image: svitlo-api:latest
    build: *api-build
    restart: "no"
    environment: *api-env
    command: ["node", "dist/db/migrate.js"]
    volumes:
      - ./docker/operator-oblenergo-ca.pem:/app/apps/api/operator-ca.pem:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    image: svitlo-api:latest
    build: *api-build
    restart: unless-stopped
    # tini as PID 1: correct signal forwarding and zombie reaping (graceful shutdown handler lives in server.ts)
    init: true
    ports:
      # Только loopback: наружу API ходит через nginx (/api/). Иначе TRUST_PROXY/лимиты можно обойти напрямую.
      - "127.0.0.1:3001:3001"
    environment: *api-env
    healthcheck:
      # node есть в любом образе; не зависит от wget/curl
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./docker/operator-oblenergo-ca.pem:/app/apps/api/operator-ca.pem:ro
      - api_snapshots:/var/lib/svitlo/snapshots
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Относительный путь: браузер ходит на тот же origin, nginx проксирует /api/ → api. Образ переносим между окружениями.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  api_snapshots:
