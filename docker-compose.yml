x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile.api

x-api-env: &api-env
  # Password comes from .env (default keeps the existing volume working until the password is rotated
  # with ALTER ROLE svitlo inside the DB: changing it here alone does NOT change an existing volume).
  DATABASE_URL: postgresql://svitlo:${POSTGRES_PASSWORD:-energymon}@db:5432/svitlo
  API_PORT: "3001"
  API_HOST: "0.0.0.0"
  SNAPSHOT_DIR: /var/lib/svitlo/snapshots
  ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a long random ADMIN_TOKEN in .env}
  SOURCE_URL: http://manual-import.invalid/disabled
  USE_MOCK_ADAPTER: "false"
  # Автоопрос оператора. По умолчанию ВЫКЛ (локальная разработка не должна стучаться к WAF оператора).
  # В production поставьте ENABLE_SCHEDULER=true в .env, иначе данные не обновляются (см. /status dataStale).
  ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
  # Новини (публічні Telegram-канали + RSS). Типово false: реліз сам не ходить у мережу.
  # Увімкнути: NEWS_COLLECT_ENABLED=true у .env. Разовий збір — POST /api/v1/admin/news/collect.
  NEWS_COLLECT_ENABLED: ${NEWS_COLLECT_ENABLED:-false}
  NEWS_COLLECT_INTERVAL_MIN: ${NEWS_COLLECT_INTERVAL_MIN:-15}
  # Диапазоны доверенных прокси (nginx в compose-сети) — нужны для корректного rate limit по IP посетителя.
  TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
  # Дозволені CORS-походження (через кому). Порожньо в production = CORS вимкнено (безпечно —
  # фронт і API ходять на один origin через nginx). '*' — тільки для локальної розробки.
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  TELEGRAM_BOT_ENABLED: "false"
  CHERNIHIV_WEB_ENABLED: ${CHERNIHIV_WEB_ENABLED:-true}
  CHERNIHIV_BASE_URL: ${CHERNIHIV_BASE_URL:-https://chernihivoblenergo.com.ua}
  # Перелік населених пунктів оператора (id через кому). Порожньо = перелік не заданий, і адаптер
  # голосно падає з причиною замість «тихо порожньо» (раніше тут було зашите одне село — с. Деснянське).
  # Перелік НП за КОАТУУ. Порожньо = беремо довідник (1509 НП Чернігівщини) і обходимо
  # його порціями, містами вперед; курсор обходу сіл живе між прогонами.
  CHERNIHIV_CITY_IDS: ${CHERNIHIV_CITY_IDS:-}
  CHERNIHIV_MAX_CITIES_PER_RUN: ${CHERNIHIV_MAX_CITIES_PER_RUN:-30}
  CHERNIHIV_OUTAGE_TYPES: ${CHERNIHIV_OUTAGE_TYPES:-1,2,6}
  # Пауза між запитами до оператора + прогрів сесії (GET /power_outages) — щоб не тригерити WAF.
  CHERNIHIV_REQUEST_DELAY_MS: ${CHERNIHIV_REQUEST_DELAY_MS:-1000}
  # Повтори однієї порції: оператор віддає 400 ESOCKETTIMEDOUT на великих містах (Чернігів),
  # наступний запит зазвичай успішний. Без повторів місто випадало з вибірки цілком.
  CHERNIHIV_RETRIES: ${CHERNIHIV_RETRIES:-2}
  CHERNIHIV_SESSION_WARMUP: ${CHERNIHIV_SESSION_WARMUP:-true}
  # Рідше опитування (30 хв) + джиттер, бо розклад ГПВ змінюється нечасто, а WAF не любить регулярність.
  PARSE_INTERVAL_MINUTES: ${PARSE_INTERVAL_MINUTES:-30}
  PARSE_INTERVAL_JITTER_MINUTES: ${PARSE_INTERVAL_JITTER_MINUTES:-5}
  # «Дзеркало» погодинного ГПВ (публічний JSON, той самий формат читає Java-ядро core/):
  # єдине джерело ПОВНОГО добового ГПВ по області, бо info_schedule_part за Turnstile, а Telegram
  # канал пише лише «зміни». Капчі й персональних даних немає. Вимкнути можна тут одним прапорцем.
  MIRROR_SCHEDULE_ENABLED: ${MIRROR_SCHEDULE_ENABLED:-true}
  MIRROR_SCHEDULE_URL: ${MIRROR_SCHEDULE_URL:-https://dtek-api.svitlo-proxy.workers.dev/}
  MIRROR_SCHEDULE_REGION: ${MIRROR_SCHEDULE_REGION:-chernihivska-oblast}
  MIRROR_SCHEDULE_IMPORT_REGIONS: ${MIRROR_SCHEDULE_IMPORT_REGIONS:-}
  MIRROR_SCHEDULE_TTL_SEC: ${MIRROR_SCHEDULE_TTL_SEC:-600}
  MIRROR_SCHEDULE_TIMEOUT_MS: ${MIRROR_SCHEDULE_TIMEOUT_MS:-15000}
  # --- Провайдери графіків по областях (apps/api/src/providers/**) ---
  # YASNO / DTEK / e-svitlo / Чернігівобленерго: кожен провайдер пише schedule_slots зі своїм
  # `source`, тому чужі рядки не затираються. Типово синхронізація ВИМКНЕНА: реліз не має
  # почати писати нові дані непомітно — вмикаємо свідомо після перевірки на живій БД.
  PROVIDER_SYNC_ENABLED: ${PROVIDER_SYNC_ENABLED:-false}
  PROVIDER_SYNC_INTERVAL_MINUTES: ${PROVIDER_SYNC_INTERVAL_MINUTES:-30}
  PROVIDER_SYNC_TIMEOUT_MS: ${PROVIDER_SYNC_TIMEOUT_MS:-15000}
  # Анти-бот (AGENTS.md, правило 6): ключ сервісу розв'язання капчі/Turnstile. Порожньо = вимкнено.
  CAPTCHA_SOLVER_API_KEY: ${CAPTCHA_SOLVER_API_KEY:-}
  CAPTCHA_SOLVER_URL: ${CAPTCHA_SOLVER_URL:-https://2captcha.com}
  # YASNO стоїть за Incapsula WAF (503 з datacenter-IP) — адреса в env, щоб можна було вказати проксі.
  YASNO_API_BASE_URL: ${YASNO_API_BASE_URL:-https://api.yasno.com.ua}
  DTEK_API_BASE_URL: ${DTEK_API_BASE_URL:-https://www.dtek-kem.com.ua}
  DTEK_DNEM_BASE_URL: ${DTEK_DNEM_BASE_URL:-https://www.dtek-dnem.com.ua}
  ESVITLO_BASE_URL: ${ESVITLO_BASE_URL:-https://cn.e-svitlo.com.ua}
  CHERNIHIVOBLENERGO_BASE_URL: ${CHERNIHIVOBLENERGO_BASE_URL:-https://chernihivoblenergo.com.ua}
  NODE_ENV: production
  LOG_LEVEL: info
  TZ: Europe/Kyiv
  # Оператор віддає неповний TLS-ланцюжок (без проміжного CA) — додаємо його з бандла,
  # щоб Node міг перевірити сертифікат chernihivoblenergo.com.ua без вимкнення перевірки.
  NODE_EXTRA_CA_CERTS: /app/apps/api/operator-ca.pem
  # Контейнерний DNS повертає NAT64-адресу (64:ff9b::/96), яка тут не маршрутизується, і undici
  # «зависає» на ній (ETIMEDOUT). Форсуємо IPv4.
  NODE_OPTIONS: "--dns-result-order=ipv4first"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: svitlo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energymon}
      POSTGRES_DB: svitlo
    ports:
      # Доступ только через loopback: сервисы ходят в БД по compose-сети,
      # публиковать порт наружу не нужно (аудит, P0 3.3).
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svitlo"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Одноразовий сервис: применяет SQL-миграции (node dist/db/migrate.js), затем завершается.
  # api стартует только после его успешного завершения (service_completed_successfully),
  # поэтому на чистом томе база гарантированно мигрирована до старта API.
  migrate:
    image: svitlo-api:latest
    build: *api-build
    restart: "no"
    environment: *api-env
    command: ["node", "dist/db/migrate.js"]
    volumes:
      - ./docker/operator-oblenergo-ca.pem:/app/apps/api/operator-ca.pem:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    image: svitlo-api:latest
    build: *api-build
    restart: unless-stopped
    # tini as PID 1: correct signal forwarding and zombie reaping (graceful shutdown handler lives in server.ts)
    init: true
    ports:
      # Только loopback: наружу API ходит через nginx (/api/). Иначе TRUST_PROXY/лимиты можно обойти напрямую.
      - "127.0.0.1:3001:3001"
    environment: *api-env
    healthcheck:
      # node есть в любом образе; не зависит от wget/curl
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./docker/operator-oblenergo-ca.pem:/app/apps/api/operator-ca.pem:ro
      - api_snapshots:/var/lib/svitlo/snapshots
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Относительный путь: браузер ходит на тот же origin, nginx проксирует /api/ → api. Образ переносим между окружениями.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  api_snapshots:
