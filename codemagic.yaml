# Codemagic: ручная unsigned-сборка iOS без подписи и Apple-учёток.
workflows:
  ios-unsigned:
    name: iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Verify or enable pnpm
        script: pnpm --version || corepack enable pnpm

      - name: Install dependencies
        script: pnpm install --frozen-lockfile

      - name: Generate iOS project
        working_directory: apps/mobile
        script: CI=1 npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        working_directory: apps/mobile/ios
        script: pod install

      - name: Build unsigned app
        working_directory: apps/mobile
        script: |
          xcodebuild \
            -workspace ios/Svitlo.xcworkspace \
            -scheme Svitlo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working_directory: apps/mobile
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Svitlo.app Payload/
          zip -qry Svitlo-unsigned.ipa Payload

    artifacts:
      - apps/mobile/Svitlo-unsigned.ipa
