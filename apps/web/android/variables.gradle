ext {
    // minSdk 26 (Android 8) — база для adaptive-иконок и современного WebView.
    // Раньше стоял 23, но ниже Android 8 всё равно нет поддержки adaptive-иконок,
    // а пользователю нужна установка на Android 13+ (33) и новее.
    minSdkVersion = 26
    compileSdkVersion = 35
    // targetSdk 35: Google Play требует 35 для новых приложений, а на Android 13+ (API 33+)
    // приложение ведёт себя одинаково, включая уведомления и обработку deeplink'ов.
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}