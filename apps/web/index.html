<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable убраны осознанно: блокировка зума ломает доступность
         для людей со слабым зрением и противоречит WCAG 1.4.4. viewport-fit=cover нужен
         для нижней панели под «чёлкой». -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Svitlo — Чернігів</title>
    <script>
      /* Тема применяется ДО первой отрисовки. Иначе на холодной загрузке мигает светлая тема,
         а на телефоне цвет строки состояния остаётся от прошлой. Режимов ровно два — світла и
         темна: «Авто» убран, потому что переключатель стал одной кнопкой, а поведение «само
         следует за системой» путало: приложение выглядело по-разному на двух телефонах
         с одинаковыми настройками. Старое сохранённое 'auto' мигрируем один раз в системную
         тему и записываем как явный выбор — так поведение остаётся прежним, но становится
         видимым и переключаемым.
         Значения цветов должны совпадать с палитрой в src/styles/globals.css. */
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (stored !== 'light' && stored !== 'dark') {
            localStorage.setItem('theme', dark ? 'dark' : 'light');
          }
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#09090b' : '#f1f5f9');
        } catch (error) {
          /* приватный режим: localStorage недоступен — берём тёмную по системной настройке */
          var darkAuto = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', darkAuto);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
