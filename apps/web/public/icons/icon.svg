<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Единый источник иконки Svitlo.

    Важно: не добавляйте внутри групп <g id="background"> и <g id="foreground">
    вложенные <g>. Генератор apps/web/scripts/generate-android-icons.mjs вырезает
    эти два слоя, чтобы собрать adaptive-иконку, круглую иконку и splash.

    Меняете картинку — правьте этот файл и пересобирайте APK:
      ./tools/build-android-apk.sh
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081226"/>
      <stop offset="0.45" stop-color="#0d2450"/>
      <stop offset="0.78" stop-color="#153a8a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.35" stop-color="#fef3c7"/>
      <stop offset="0.72" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="bolt-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect width="512" height="512" rx="112" fill="url(#light)"/>
    <circle cx="256" cy="256" r="174" fill="none" stroke="#93c5fd" stroke-opacity="0.16" stroke-width="3"/>
    <circle cx="256" cy="256" r="218" fill="none" stroke="#93c5fd" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M256 38 A218 218 0 0 1 441 142" fill="none" stroke="#7dd3fc" stroke-opacity="0.34" stroke-width="6" stroke-linecap="round"/>
    <circle cx="441" cy="142" r="5" fill="#bae6fd" fill-opacity="0.9"/>
  </g>

  <g id="foreground">
    <circle cx="256" cy="256" r="230" fill="url(#bolt-glow)"/>
    <!-- Тень отдельной фигурой, а не filter: SVG с filter не подхватывается как внешняя
         картинка при рендере splash, и молния на splash исчезала. -->
    <path d="M300 40 128 286h110l-30 186 176-264H270L300 40Z" fill="#020617" fill-opacity="0.32" transform="translate(0 12)"/>
    <path d="M300 40 128 286h110l-30 186 176-264H270L300 40Z" fill="url(#bolt)"/>
    <path d="M360 110 364.5 123.5 378 128 364.5 132.5 360 146 355.5 132.5 342 128 355.5 123.5Z" fill="#e0f2fe" fill-opacity="0.9"/>
    <path d="M146 369 148.8 377.2 157 380 148.8 382.8 146 391 143.2 382.8 135 380 143.2 377.2Z" fill="#e0f2fe" fill-opacity="0.75"/>
  </g>
</svg>
