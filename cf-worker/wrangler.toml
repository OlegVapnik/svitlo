name = "svitlo-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# Автономный Worker: раздаёт данные по HTTPS 24/7, раз в 20 минут сам забирает график
# оператора и новости. Никаких Node-зависимостей — только стандартный Web Fetch API,
# D1 (постоянное хранилище) и Cache API.
#
# Хранилище: D1 `svitlo` — снимок графиков и новостей; дополнительно тот же снимок кладётся
# в Cache API, поэтому повторные чтения не бьют по D1 (бесплатный план жёстко лимитирует).
workers_dev = true

# Хранилище для графиков и новостей. Создаётся один раз:
#   npx wrangler d1 create svitlo
# → вставьте полученный database_id в [[d1_databases]] ниже.

# Дедлайн крона: */20 — график оператора меняется по полчаса, чаще не нужно,
# а лимиты бесплатного плана расходуются на каждый запуск.
[triggers]
crons = ["*/20 * * * *"]

# Зеркало графиков ДТЕК — единственный источник расписания. Заменяет Node-бэкенд.
# Именно [vars], а не [[vars]]: в форме массива wrangler не привязывает переменные, и
# MIRROR_SCHEDULE_URL приходит в коде как undefined — график молча остаётся пустым.
[vars]
MIRROR_SCHEDULE_URL = "https://dtek-api.svitlo-proxy.workers.dev/"

# Аварийный тормоз на случай, когда дневной лимит D1 (`rows_written`) почти исчерпан: список
# ключей фида или канонических `cpu` через запятую. Пусто (по умолчанию) — импортируются все
# области, которые фид реально отдаёт. Строка закомментирована намеренно: пустое значение
# в [vars] выглядело бы как «настроено», хотя смысл у него тот же, что у отсутствия переменной.
# MIRROR_SCHEDULE_IMPORT_REGIONS = "kyivska-oblast,chernihivska-oblast"

# Публичные Telegram-веб-страницы операторов (не API: токен бота не нужен, парсится /s/<канал>).
NEWS_CHANNELS = "chernigivoblenergo,ukrenergo,dtek_ua"

# Сбор точечных отключений Чернігівобленерго. Список НП намеренно пустой: воркер сам
# узнаёт его у оператора (info_disable?nq=city) и кэширует в D1. Зашивать вручную одно село
# нельзя — это создало бы впечатление, что мы видим отключения по всей области.
CHERNIHIV_WEB_ENABLED = "true"
CHERNIHIV_CITY_IDS = ""
CHERNIHIV_WEB_BASE_URL = "https://chernihivoblenergo.com.ua"

[[d1_databases]]
binding = "DB"
database_name = "svitlo"
database_id = "e3613ade-704e-480c-924a-c765745ea59c"
